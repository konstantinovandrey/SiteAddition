<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя библиотека</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <h1>📚 Моя библиотека</h1>
        <div class="filters">
            <input type="text" id="search" placeholder="Поиск по книгам...">
            <select id="shelf-filter">
                <option value="all">Все полки</option>
                <option value="read">Прочитано</option>
                <option value="reading">Читаю сейчас</option>
                <option value="want">Хочу прочитать</option>
            </select>
        </div>
    </header>

    <div class="books-grid" id="books-container"></div>

    <script src="assets/js/books.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
